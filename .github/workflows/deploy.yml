name: Build and Deploy Lectures
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/*'
      - 'lectures/**'
      - 'assessments/**'
      - 'workshops/**'
      - 'resources/**'
      - 'css/**'
      - 'templates/**'
      - 'filters/**'
      - 'generate_index.py'
      - 'Makefile'
      - '_config.toml'
      - 'references.bib'
      - 'apa.csl'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    # A normal build is ~7 min (~1 min on a cache hit). This only bounds a hung
    # step — a stuck tlmgr or lualatex would otherwise burn the 6 hour default.
    timeout-minutes: 30

    container:
      image: pandoc/latex:3.10.0.0-alpine
      options: --user root

    steps:
      - name: Install Alpine Dependencies
        run: apk add --no-cache bash git python3 py3-pip py3-yaml make

      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Mark workspace as git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Restore build cache
        uses: actions/cache@v6
        with:
          path: ./build
          # filters/ is in the key because a filter change alters the PDFs
          # without touching any .md. git-restore-mtime would leave the cached
          # PDFs looking newer than their sources, and make would skip them.
          key: build-v1-${{ hashFiles('Makefile', '_config.toml', 'references.bib', 'apa.csl', 'filters/**') }}-${{ github.sha }}
          restore-keys: |
            build-v1-${{ hashFiles('Makefile', '_config.toml', 'references.bib', 'apa.csl', 'filters/**') }}-

      - name: Restore file modification times
        uses: chetan/git-restore-mtime-action@v2

      - name: Install Latex Dependencies
        run: |
          # This image ships TeX Live 2026, matching the current live CTAN
          # release. tlmgr still refuses to install until its own revision
          # matches the (moving) live tlnet repo, so self-update first — this
          # is allowed now that image and repo are the same release year.
          # If the live CTAN later rolls over to 2027, bump the image tag to a
          # pandoc/latex build carrying that year's TeX Live to keep them aligned.
          #
          # tlmgr's default repository is the mirror.ctan.org redirector, which
          # hands out a different mirror per request. A mirror caught mid-rollover
          # serves no texlive.tlpdb, tlmgr exits 1, and the deploy is lost with
          # nothing on the published site to show it went stale. So try the
          # redirector twice (it re-rolls the mirror each time), then fall back to
          # named mirrors that track tlnet closely.
          REPOS="https://mirror.ctan.org/systems/texlive/tlnet
          https://mirror.ctan.org/systems/texlive/tlnet
          https://mirror.aarnet.edu.au/pub/CTAN/systems/texlive/tlnet
          https://ftp.fau.de/ctan/systems/texlive/tlnet
          https://mirrors.rit.edu/CTAN/systems/texlive/tlnet
          https://ctan.math.illinois.edu/systems/texlive/tlnet"

          PACKAGES="libertine
          sourcecodepro
          ly1
          sectsty
          lastpage
          hanging
          beamer
          beamertheme-metropolis
          pgf
          pgfopts
          beamercolorthemeowl
          noto
          noto-emoji"

          installed=""
          for repo in $REPOS; do
            echo "::group::tlmgr via $repo"
            if tlmgr option repository "$repo" \
              && tlmgr update --self \
              && tlmgr install $PACKAGES; then
              installed="$repo"
            fi
            echo "::endgroup::"
            if [ -n "$installed" ]; then
              echo "LaTeX dependencies installed from $installed"
              break
            fi
            echo "tlmgr failed against $repo — trying the next mirror"
            sleep 10
          done

          if [ -z "$installed" ]; then
            echo "::error::tlmgr could not install the LaTeX dependencies from any known CTAN mirror"
            exit 1
          fi

      - name: Install Dart Sass
        run: |
          wget -O dart-sass.tar.gz https://github.com/sass/dart-sass/releases/download/1.101.0/dart-sass-1.101.0-linux-x64-musl.tar.gz
          tar -xzf dart-sass.tar.gz -C /usr/local/
          echo "/usr/local/dart-sass" >> $GITHUB_PATH
          rm dart-sass.tar.gz
          /usr/local/dart-sass/sass --version

      - name: Build public documents for website
        run: |
          make public

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        # v4+ excludes dotfiles from the artifact. Nothing in build/ is a dotfile
        # and Pages runs no Jekyll here (build_type=workflow), so no .nojekyll needed.
        uses: actions/upload-pages-artifact@v5
        with:
          path: './build'

  deploy:
    # Build validates every push and pull request; only main actually deploys.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Pages rejects overlapping deployments, so two pushes landing close together
    # can lose one. Serialise here rather than at workflow level, so PR builds
    # still run in parallel. Never cancel in progress: a half-finished deploy is
    # worse than a queued one.
    concurrency:
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
