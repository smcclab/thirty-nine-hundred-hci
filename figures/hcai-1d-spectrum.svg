<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 380" width="1400" height="380" font-family="Noto Sans">
  <title>A one-dimensional slider from human control to computer automation</title>
  <defs><linearGradient id="bar" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#b8c4c8"/><stop offset="1" stop-color="#2a9d8f"/></linearGradient></defs>
  <rect x="200" y="128.0" width="1000" height="44" rx="8" fill="url(#bar)" stroke="#fafafa" stroke-width="3"/>
  <polygon points="700.0,60 760.0,182.0 640.0,182.0" fill="#e9c46a" stroke="#fafafa" stroke-width="4" stroke-linejoin="round"/>
  <text font-size="36" font-weight="400" fill="#fafafa" text-anchor="middle"><tspan x="200.0" y="250.5">Human</tspan><tspan x="200.0" y="295.5">control</tspan></text>
  <text font-size="36" font-weight="400" fill="#fafafa" text-anchor="middle"><tspan x="1200.0" y="250.5">Computer</tspan><tspan x="1200.0" y="295.5">automation</tspan></text>
</svg>
