<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Lets rsvg-convert find the Noto Sans that TeX Live ships (the font the
     Beamer slides use), which the system fontconfig does not index. -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <dir>/usr/local/texlive/2026/texmf-dist/fonts/truetype/google/noto</dir>
  <cachedir>~/.cache/fontconfig</cachedir>
</fontconfig>
